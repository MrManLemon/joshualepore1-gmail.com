<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover lets the app draw under the notch; CSS env() pads it. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LiftQuest</title>
  <meta name="description" content="Gamified strength-training tracker">
  <meta name="theme-color" content="#0f1115">
  <!-- iOS home-screen app settings -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LiftQuest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main id="view" class="view"></main>
  <nav id="tabs" class="tabs" aria-label="Main"></nav>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <!-- type="module" = modern JS with import/export, loaded deferred. -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
